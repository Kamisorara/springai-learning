spring:
  application:
    name: springai-rag-demo1
  ai:
    # LLM配置
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas/v4
      chat:
        options:
          model: GLM-4.5V
      # Embedding模型配置
      embedding:
        api-key: ${OPENAI_API_KEY:}
        base-url: https://open.bigmodel.cn/api/paas/v4
        options:
          model: embedding-3
    # 向量数据库配置
    vectorstore:
      milvus:
        initialize-schema: true
        client:
          host: ${MILVUS_HOST:127.0.0.1}
          port: ${MILVUS_PORT:19530}
          username: ${MILVUS_USERNAME:waylon}
          password: ${MILVUS_PASSWORD:123456}
        databaseName: ${MILVUS_DATABASE:default}
        collectionName: ${MILVUS_COLLECTION:vector_store_2048}
        embeddingDimension: 2048
        indexType: IVF_FLAT
        metricType: COSINE
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 2MB

# DataAgent配置
data-agent:
  vector-store:
    embedding-dimension: 2048
    similarity-threshold: 0.2
    batch-del-topk-limit: 5000
    topk-limit: 30
  embedding-batch:
    encoding-type: cl100k_base
    max-token-count: 8000
    reserve-percentage: 0.2
    max-text-count: 10

server:
  port: 8080